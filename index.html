
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぽこん！お題ビンゴ</title>

<style>
:root {
  font-family: system-ui, "Yu Gothic", sans-serif;
  color: #392e43;
}

* {
  box-sizing: border-box;
}

body {
  --accent: #e65b97;
  --ink: #44324f;
  --paper: #fffdfd;
  --soft: #fff0f7;
  --stroke: #f3d7e5;
  --glow: #ffadd1;

  margin: 0;
  background: linear-gradient(135deg,#ffe7f5,#fffafd,#ece6ff);
  min-height: 100vh;
}

body[data-theme="sky"] {
  --accent: #468cca;
  --ink: #314b70;
  --soft: #ebf5ff;
  --stroke: #cfe4f7;
  --glow: #a5d8ff;
}

body[data-theme="mint"] {
  --accent: #299b85;
  --ink: #305e54;
  --soft: #e7f9f2;
  --stroke: #c6eadf;
  --glow: #99e3ca;
}

button,input,select {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

.wrapper {
  max-width: 1100px;
  margin: auto;
  padding: 25px 15px 60px;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  font-size: clamp(28px,5vw,48px);
  margin-bottom: 8px;
}

header p {
  font-size: 13px;
  color: #827488;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 25px;
}

.btn {
  border: 1px solid var(--stroke);
  border-radius: 12px;
  background: white;
  color: var(--ink);
  padding: 12px 15px;
  font-weight: bold;
  font-size: 13px;
}

.btn.primary,
.btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.btn:active {
  transform: scale(.97);
}

.columns {
  display: grid;
  grid-template-columns: minmax(0,1.4fr) minmax(260px,.8fr);
  gap: 20px;
  align-items: start;
}

.panel {
  background: white;
  border-radius: 20px;
  padding: 20px;
  border: 1px solid #eee2ed;
  box-shadow: 0 8px 25px #4e2f5310;
}

.side {
  display: grid;
  gap: 15px;
}

h2 {
  font-size: 23px;
  overflow-wrap: anywhere;
}

h3 {
  font-size: 17px;
}

.subtle {
  color: #8a7d90;
  font-size: 12px;
  line-height: 1.7;
}

.board {
  --n: 5;
  background: var(--ink);
  border-radius: 20px;
  padding: 12px;
  box-shadow: 0 12px 24px #39274440;
}

.header-row,
.grid-cells {
  display: grid;
  grid-template-columns: repeat(var(--n),minmax(0,1fr));
  gap: 6px;
}

.header-row {
  padding-bottom: 10px;
  color: #ffe7f3;
  text-align: center;
  font-weight: 900;
  font-size: clamp(22px,4vw,38px);
}

.grid-cells button {
  border: none;
  aspect-ratio: 1;
  min-width: 0;
  border-radius: 9px;
  background: var(--paper);
  color: #4a3d50;
  font-size: clamp(10px,1.5vw,15px);
  font-weight: bold;
  padding: 5px;
  position: relative;
  line-height: 1.3;
  overflow: hidden;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.grid-cells button.long {
  font-size: clamp(8px,1.2vw,12px);
}

/* タップしたマスに穴を開ける */
.grid-cells button.hole {
  background: radial-gradient(
    circle at center,
    var(--ink) 0 60%,
    var(--paper) 65%
  );
}

.grid-cells button.hole::after {
  content: "";
  position: absolute;
  inset: 17%;
  border: 3px solid var(--glow);
  border-radius: 50%;
  box-shadow: inset 0 2px 12px #18082190;
}

.grid-cells button.hole span {
  visibility: hidden;
}

.grid-cells button.winning::after {
  border-color: #ffe679;
  box-shadow: 0 0 14px #ffe67988;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}

.stat {
  text-align: center;
  padding: 12px 3px;
  background: #faf4f9;
  border-radius: 12px;
  font-size: 11px;
}

.stat b {
  display: block;
  font-size: 29px;
  color: var(--accent);
}

.meter {
  background: #f4e7f0;
  height: 10px;
  border-radius: 20px;
  overflow: hidden;
  margin: 14px 0;
}

.meter div {
  background: var(--accent);
  height: 100%;
  width: 0;
  transition: width .2s;
}

.notice {
  background: var(--soft);
  padding: 12px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 13px;
}

.buttons2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.buttons2 .wide {
  grid-column: 1/-1;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 16px 0 7px;
}

input[type="text"],
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #e8dce8;
  background: white;
  border-radius: 11px;
}

.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.task-list {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 9px;
  max-height: 470px;
  overflow-y: auto;
}

.task-item {
  border: 1px solid #ede2ed;
  background: #fdfafd;
  border-radius: 12px;
  padding: 9px;
}

.task-item.middle {
  background: var(--soft);
  border-color: var(--glow);
}

.task-item label {
  font-size: 11px;
  margin: 0 0 5px;
}

.task-item input {
  font-size: 12px;
  padding: 9px;
}

.edit-actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 15px;
}

.preview {
  --n: 5;
  background: var(--ink);
  display: grid;
  grid-template-columns: repeat(var(--n),minmax(0,1fr));
  gap: 5px;
  padding: 10px;
  border-radius: 13px;
}

.preview div {
  background: white;
  border-radius: 6px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 3px;
  font-size: 11px;
  font-weight: bold;
  overflow: hidden;
  overflow-wrap: anywhere;
}

.preview .middle {
  background: var(--soft);
}

#editor {
  display: none;
}

dialog {
  border: none;
  border-radius: 20px;
  padding: 22px;
  width: min(550px,calc(100% - 25px));
}

dialog::backdrop {
  background: #27193291;
}

textarea {
  width: 100%;
  border: 1px solid var(--stroke);
  border-radius: 12px;
  padding: 12px;
  min-height: 120px;
  font-size: 12px;
  word-break: break-all;
}

footer {
  text-align: center;
  font-size: 11px;
  color: #aca0ae;
  margin-top: 34px;
}

@media(max-width:800px) {
  .columns {
    grid-template-columns: 1fr;
  }

  .grid-cells button {
    font-size: clamp(10px,2.5vw,16px);
  }

  .grid-cells button.long {
    font-size: clamp(9px,2vw,13px);
  }
}

@media(max-width:480px) {
  .wrapper {
    padding: 17px 11px 44px;
  }

  .panel {
    padding: 14px;
  }

  .board {
    padding: 8px;
  }

  .header-row,
  .grid-cells {
    gap: 4px;
  }

  .grid-cells button {
    padding: 3px;
    font-size: clamp(9px,2.45vw,12px);
  }

  .grid-cells button.long {
    font-size: clamp(8px,2vw,10px);
  }

  .task-list,
  .fields {
    grid-template-columns: 1fr;
  }
}

@media print {
  .tabs,.side,.subtle,#editor,footer {
    display: none!important;
  }

  .columns {
    display: block;
  }

  .board {
    box-shadow: none;
  }
}
</style>
</head>

<body data-theme="berry">

<div class="wrapper">

<header>
  <h1>ぽこん！お題ビンゴ 🎯</h1>
  <p>お題を作ってリンクで共有！タップして穴を開けよう！</p>
</header>

<div class="tabs">
  <button id="playTab" class="btn active">
    🎮 ビンゴで遊ぶ
  </button>

  <button id="editTab" class="btn">
    ✏️ お題を作る
  </button>
</div>

<!-- プレイ画面 -->
<section class="columns" id="play">

  <div>
    <h2 id="boardTitle">お題ビンゴ</h2>

    <div class="board" id="board">
      <div class="header-row" id="letterRow"></div>
      <div class="grid-cells" id="cells"></div>
    </div>

    <p class="subtle" style="text-align:center">
      タップで穴が空くよ！もう一度タップすると戻せるよ。
    </p>
  </div>

  <aside class="side">

    <div class="panel">
      <h3>📊 達成状況</h3>

      <div class="stats">
        <div class="stat">
          <b id="done">0</b>達成
        </div>
        <div class="stat">
          <b id="bingo">0</b>ビンゴ
        </div>
        <div class="stat">
          <b id="reach">0</b>リーチ
        </div>
      </div>

      <div class="meter">
        <div id="bar"></div>
      </div>

      <div class="notice" id="status">
        達成したマスをタップしてね！
      </div>
    </div>

    <div class="panel">
      <h3>🔗 このカードを共有</h3>

      <p class="subtle">
        全員が同じお題で遊べます。
        穴の状態はそれぞれ別々です。
      </p>

      <div class="buttons2">

        <button id="shareBtn" class="btn primary wide">
          🔗 共有リンクを作ってコピー
        </button>

        <button id="resetBtn" class="btn">
          ↺ 穴をリセット
        </button>

        <button id="editBtn" class="btn">
          ✏️ お題を編集
        </button>

        <button id="printBtn" class="btn wide">
          🖨️ 印刷・PDF保存
        </button>

      </div>
    </div>

  </aside>
</section>

<!-- 編集画面 -->
<section class="columns" id="editor">

  <div class="panel">

    <h2>✏️ お題を自由に設定</h2>

    <p class="subtle">
      中央のマスも普通のお題にできるよ！
    </p>

    <label>カードのタイトル</label>
    <input id="titleInput" type="text" maxlength="60">

    <div class="fields">

      <div>
        <label>マスの数</label>
        <select id="sizeInput">
          <option value="3">3 × 3</option>
          <option value="4">4 × 4</option>
          <option value="5">5 × 5</option>
        </select>
      </div>

      <div>
        <label>カードの色</label>
        <select id="themeInput">
          <option value="berry">💗 ベリー</option>
          <option value="sky">💙 そら</option>
          <option value="mint">💚 ミント</option>
        </select>
      </div>

    </div>

    <label>お題一覧 <span id="taskCount"></span></label>

    <div class="task-list" id="taskList"></div>

    <div class="edit-actions">
      <button id="applyBtn" class="btn primary">
        ✅ このお題でカードを作る
      </button>

      <button id="cancelBtn" class="btn">
        キャンセル
      </button>
    </div>

  </div>

  <aside class="panel">
    <h3>👀 プレビュー</h3>

    <h3 id="previewTitle"></h3>

    <div id="preview" class="preview"></div>
  </aside>

</section>

<footer>
  POKON! TASK BINGO
</footer>

</div>

<!-- 共有ダイアログ -->
<dialog id="shareDialog">

  <h2>🔗 共有リンクができたよ！</h2>

  <p class="subtle">
    このURLをDiscordやLINEで送ってね！
  </p>

  <textarea id="shareUrl" readonly></textarea>

  <div class="edit-actions">
    <button id="copyBtn" class="btn primary">
      📋 リンクをコピー
    </button>

    <button id="closeBtn" class="btn">
      閉じる
    </button>
  </div>

</dialog>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const SAVE = "bingo-card-data-v1";
const MARKS = "bingo-card-marks-v1-";

const samples = [
  "初見さんが来る",
  "コメントが盛り上がる",
  "神プレイが出る",
  "思わず笑う",
  "ゲームに勝つ",
  "話が脱線する",
  "ミスをする",
  "新しい発見",
  "ナイスなコメント",
  "応援される",
  "予想外の展開",
  "褒められる",
  "中央も好きなお題！",
  "いい勝負になる",
  "配信が延長する",
  "驚く展開",
  "クリアできる",
  "大逆転する",
  "思い出を話す",
  "面白いバグ",
  "久しぶりの再会",
  "みんなで拍手",
  "目標を達成",
  "スクショを撮る",
  "最後に挨拶する"
];

const fresh = () => ({
  title: "みんなのお題ビンゴ",
  n: 5,
  theme: "berry",
  items: [...samples]
});

// カードデータの整理
function clean(obj) {
  if (
    !obj ||
    ![3,4,5].includes(Number(obj.n)) ||
    !Array.isArray(obj.items)
  ) {
    throw Error("invalid card");
  }

  const n = Number(obj.n);

  const items = obj.items
    .slice(0,n*n)
    .map(x => String(x).slice(0,70));

  while (items.length < n*n) {
    items.push("お題 " + (items.length+1));
  }

  return {
    title: String(obj.title || "お題ビンゴ").slice(0,60),
    n,
    theme: ["berry","sky","mint"].includes(obj.theme)
      ? obj.theme : "berry",
    items
  };
}

// URLにお題を埋め込む
function toCode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));

  let raw = "";

  for (const b of bytes) {
    raw += String.fromCharCode(b);
  }

  return btoa(raw)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

// URLからお題を読み込む
function fromCode(code) {
  if (!/^[A-Za-z0-9_-]+$/.test(code) || code.length > 25000) {
    throw Error("invalid code");
  }

  const bin = atob(
    code.replace(/-/g,"+").replace(/_/g,"/") +
    "=".repeat((4-code.length%4)%4)
  );

  const bytes = Uint8Array.from(
    bin, c => c.charCodeAt(0)
  );

  return clean(
    JSON.parse(new TextDecoder().decode(bytes))
  );
}

function getShared() {
  try {
    const match = location.hash.match(/^#card=([\w-]+)$/);
    return match ? fromCode(match[1]) : null;
  } catch {
    return null;
  }
}

let card = getShared();

if (!card) {
  try {
    card = clean(JSON.parse(localStorage.getItem(SAVE)));
  } catch {
    card = fresh();
  }
}

let marks = new Set();

// カードごとに保存先を分ける
function cardKey() {
  const str = JSON.stringify(card);
  let h = 2166136261;

  for (let i=0;i<str.length;i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h,16777619);
  }

  return MARKS + (h>>>0).toString(36) + "-" + str.length;
}

function loadMarks() {
  try {
    marks = new Set(
      JSON.parse(localStorage.getItem(cardKey())) || []
    );
  } catch {
    marks = new Set();
  }

  marks = new Set(
    [...marks].filter(i =>
      Number.isInteger(i) &&
      i >= 0 &&
      i < card.n * card.n
    )
  );
}

function saveMarks() {
  try {
    localStorage.setItem(
      cardKey(),
      JSON.stringify([...marks])
    );
  } catch {}
}

// ビンゴの判定ライン
function lines(n) {
  const result = [];

  for (let y=0;y<n;y++) {
    result.push(
      Array.from({length:n},(_,x)=>y*n+x)
    );
  }

  for (let x=0;x<n;x++) {
    result.push(
      Array.from({length:n},(_,y)=>y*n+x)
    );
  }

  result.push(
    Array.from({length:n},(_,i)=>i*n+i)
  );

  result.push(
    Array.from({length:n},(_,i)=>i*n+n-i-1)
  );

  return result;
}

function stats() {
  const all = lines(card.n);

  const wins = all.filter(
    line => line.every(i => marks.has(i))
  );

  const reaches = all.filter(
    line => line.filter(i => !marks.has(i)).length === 1
  ).length;

  return {wins,reaches};
}

// カード描画
function render() {
  document.body.dataset.theme = card.theme;

  $("boardTitle").textContent = card.title;

  $("board").style.setProperty("--n",card.n);

  $("letterRow").replaceChildren();
  $("cells").replaceChildren();

  for (let i=0;i<card.n;i++) {
    const d = document.createElement("div");
    d.textContent = "BINGO"[i];
    $("letterRow").append(d);
  }

  const {wins,reaches} = stats();

  const winning = new Set(wins.flat());

  card.items.forEach((item,i) => {
    const button = document.createElement("button");
    const span = document.createElement("span");

    button.type = "button";
    button.title = item;

    span.textContent = item;
    button.append(span);

    if (item.length > 13) {
      button.classList.add("long");
    }

    if (marks.has(i)) {
      button.classList.add("hole");
    }

    if (winning.has(i)) {
      button.classList.add("winning");
    }

    button.setAttribute(
      "aria-pressed",
      String(marks.has(i))
    );

    button.onclick = () => {
      if (marks.has(i)) {
        marks.delete(i);
      } else {
        marks.add(i);
      }

      saveMarks();
      render();
    };

    $("cells").append(button);
  });

  $("done").textContent = marks.size;
  $("bingo").textContent = wins.length;
  $("reach").textContent = reaches;

  $("bar").style.width =
    (100 * marks.size / card.items.length) + "%";

  $("status").textContent = wins.length
    ? `🎉 ${wins.length}ビンゴ達成！おめでとう！`
    : reaches
    ? `あと1マスでビンゴ！リーチ ${reaches}本 ✨`
    : "お題を達成したらマスをタップ！";
}

// 編集画面
function showEdit(edit) {
  $("play").style.display = edit ? "none" : "grid";
  $("editor").style.display = edit ? "grid" : "none";

  $("playTab").classList.toggle("active",!edit);
  $("editTab").classList.toggle("active",edit);

  if (edit) fillEditor();
}

function editorItems() {
  return [...$("taskList").querySelectorAll("input")]
    .map(x => x.value.trim());
}

function rebuildEditor(old) {
  const n = Number($("sizeInput").value);

  const mid = n%2
    ? Math.floor(n*n/2)
    : -1;

  $("taskList").replaceChildren();

  for (let i=0;i<n*n;i++) {
    const box = document.createElement("div");
    const label = document.createElement("label");
    const input = document.createElement("input");

    box.className =
      "task-item" + (i===mid ? " middle" : "");

    label.textContent =
      (i+1) + "番" + (i===mid ? "（中央）" : "");

    input.type = "text";
    input.maxLength = 70;
    input.placeholder = "ここにお題を入力";
    input.value = old[i] || "";

    input.oninput = preview;

    box.append(label,input);
    $("taskList").append(box);
  }

  preview();
}

function fillEditor() {
  $("titleInput").value = card.title;
  $("sizeInput").value = card.n;
  $("themeInput").value = card.theme;

  rebuildEditor(card.items);
}

function preview() {
  const n = Number($("sizeInput").value);
  const mid = n%2 ? Math.floor(n*n/2) : -1;
  const items = editorItems();

  $("taskCount").textContent =
    `(${items.filter(Boolean).length}/${n*n})`;

  $("previewTitle").textContent =
    $("titleInput").value || "お題ビンゴ";

  $("preview").style.setProperty("--n",n);
  $("preview").replaceChildren();

  items.forEach((item,i) => {
    const d = document.createElement("div");

    d.textContent = item || "未入力";

    if (i===mid) {
      d.className = "middle";
    }

    $("preview").append(d);
  });

  document.body.dataset.theme =
    $("themeInput").value;
}

// 編集操作
$("sizeInput").onchange = () => {
  rebuildEditor(editorItems());
};

$("titleInput").oninput = preview;
$("themeInput").onchange = preview;

$("playTab").onclick = () => {
  showEdit(false);
  render();
};

$("editTab").onclick = () => showEdit(true);
$("editBtn").onclick = () => showEdit(true);

$("cancelBtn").onclick = () => {
  showEdit(false);
  render();
};

// お題を確定
$("applyBtn").onclick = () => {
  const n = Number($("sizeInput").value);
  const items = editorItems();

  if (items.some(x => !x)) {
    alert("全てのマスにお題を入力してね！");
    return;
  }

  const next = clean({
    title: $("titleInput").value.trim() || "お題ビンゴ",
    n,
    theme: $("themeInput").value,
    items
  });

  card = next;

  try {
    localStorage.setItem(SAVE,JSON.stringify(card));
  } catch {}

  // 以前の共有URLを解除
  if (location.hash) {
    history.replaceState(
      null,"",
      location.pathname + location.search
    );
  }

  loadMarks();
  showEdit(false);
  render();

  window.scrollTo(0,0);
};

// 共有URL作成
function makeLink() {
  const url = new URL(location.href);

  url.hash = "card=" + toCode(card);

  return url.toString();
}

$("shareBtn").onclick = () => {
  if (location.protocol === "file:") {
    alert("GitHub Pagesで公開してから共有してね！");
    return;
  }

  $("shareUrl").value = makeLink();

  $("shareDialog").showModal();
  copyLink();
};

async function copyLink() {
  const value = $("shareUrl").value;

  try {
    await navigator.clipboard.writeText(value);
    $("copyBtn").textContent = "✅ コピーできた！";
  } catch {
    $("shareUrl").focus();
    $("shareUrl").select();
    $("copyBtn").textContent = "選択したURLをコピーしてね";
  }
}

$("copyBtn").onclick = copyLink;

$("closeBtn").onclick = () => {
  $("shareDialog").close();
};

// リセット
$("resetBtn").onclick = () => {
  if (confirm("自分の穴を全部元に戻しますか？")) {
    marks.clear();
    saveMarks();
    render();
  }
};

$("printBtn").onclick = () => window.print();

// 共有リンクを開いたとき
window.addEventListener("hashchange",() => {
  const incoming = getShared();

  if (incoming) {
    card = incoming;
    loadMarks();
    showEdit(false);
    render();
  }
});

// 起動
loadMarks();
render();

})();
</script>

</body>
</html>
